  ############# Victron SmartShunt ##################  
       
  - platform: victron
    victron_id: victron0
    battery_voltage:
      id: "${name}_${smartshunt}_battery_voltage"
      name: "Battery voltage"
      accuracy_decimals: 2
      device_class: "voltage"
      state_class: "measurement"
      filters:
      - quantile:
          window_size: 7
          send_every: 4
          send_first_at: 3
          quantile: .3
       #      on_value:
 #       - if:  ##### si tension batterie < seuil bas    ######
 #          condition:
 #            and:
 #              - switch.is_on: ${name}_ats_automatic_control
 #              - lambda: |-
 #                 return ( ( float(id(${name}_${smartshunt}_total_voltage).state) < float(id(${name}_${ats}_tension_bascule_solar_to_grid_number).state) )     );            
 #          then:
 #            - script.execute: script_from_solar_to_grid
 
 #       - if:  ##### si tension batterie > seuil haut    ######
 #          condition:
 #            and: 
 #              - switch.is_on: ${name}_ats_automatic_control
 #              - lambda: |-
 #                  return ( ( float(id(${name}_${smartshunt}_total_voltage).state) > float(id(${name}_${ats}_tension_bascule_solar_to_grid_number).state) )     );            
 #          then:
 #            - script.execute: script_from_grid_to_solar
    midpoint_deviation_of_the_battery_bank:
      id: "${name}_${smartshunt}_midpoint_deviation_of_the_battery_bank"
      name: "Battery midpoint voltage deviation"
      accuracy_decimals: 2
    battery_current:
      id: "${name}_${smartshunt}_battery_current"
      name: "Battery current"
      accuracy_decimals: 2
      device_class: "current"
      state_class: "measurement"
    instantaneous_power:
      id: "${name}_${smartshunt}_instantaneous_power"
      name: "Battery instantaneous power"
      device_class: "power"
      state_class: "measurement"
      filters:
        - clamp:
            min_value: -5500
            max_value: 5500
    consumed_amp_hours:
      id: "${name}_${smartshunt}_consumed_amp_hours"
      name: "Consumed Ah"
      accuracy_decimals: 2
    state_of_charge:
      id: "${name}_${smartshunt}_state_of_charge"
      name: "State of Charge"
      device_class: battery
      state_class: measurement
      accuracy_decimals: 1

      # SoC changes slowly, so use the SAME filtered value for both
      # Home Assistant and control logic. A median filter rejects isolated
      # high or low outliers without deliberately biasing SoC downward.
      filters:
        - median:
            window_size: 7
            send_every: 3
            send_first_at: 3

      # Raw readings are NOT used for SoC thresholds. They only tell us
      # whether the SmartShunt is still delivering plausible SoC frames.
      on_raw_value:
        then:
          - lambda: |-
              if (!isnan(x) && x >= 0.0f && x <= 100.0f) {
                id(${name}_${smartshunt}_soc_last_valid_ms) = millis();
                id(${name}_${smartshunt}_soc_raw_seen) = true;
              } else {
                id(${name}_${smartshunt}_soc_raw_seen) = false;
              }

      # All actual charge/grid threshold decisions use this filtered value.
      on_value:
        then:
          # ----------------------------------------------------------
          # Low-SoC source-priority fallback with recovery hysteresis.
          # Only restore SBU later if this automation was the one that
          # originally changed the priority to SUB.
          # ----------------------------------------------------------
          - if:
              condition:
                lambda: |-
                  return id(${name}_${inverter}_grid_recovery_soc).state
                      > id(${name}_${inverter}_grid_fallback_soc).state;

              then:
                # Low SoC -> SUB, unless already SUB.
                - if:
                    condition:
                      lambda: |-
                        return !isnan(x)
                            && (x < id(${name}_${inverter}_grid_fallback_soc).state)
                            && (id(${name}_${inverter}_output_source_priority_select).current_option()
                                != "Solar Utility Battery");

                    then:
                      - select.set:
                          id: ${name}_${inverter}_output_source_priority_select
                          option: "Solar Utility Battery"
                      - lambda: |-
                          id(${name}_${inverter}_grid_fallback_active) = true;
                      - logger.log:
                          level: WARN
                          tag: "grid_fallback"
                          format: "SoC %.1f%% < %.0f%% -> switching to Solar Utility Battery"
                          args:
                            - 'x'
                            - 'id(${name}_${inverter}_grid_fallback_soc).state'

                    else:
                      # Recovered -> SBU, but only if automation owns the
                      # fallback and the inverter is still in SUB.
                      - if:
                          condition:
                            lambda: |-
                              return !isnan(x)
                                  && (x >= id(${name}_${inverter}_grid_recovery_soc).state)
                                  && id(${name}_${inverter}_grid_fallback_active);

                          then:
                            - if:
                                condition:
                                  lambda: |-
                                    return id(${name}_${inverter}_output_source_priority_select).current_option()
                                        == "Solar Utility Battery";
                                then:
                                  - select.set:
                                      id: ${name}_${inverter}_output_source_priority_select
                                      option: "Solar Battery Utility"
                                  - logger.log:
                                      level: INFO
                                      tag: "grid_fallback"
                                      format: "SoC %.1f%% >= %.0f%% -> recovered, restoring Solar Battery Utility"
                                      args:
                                        - 'x'
                                        - 'id(${name}_${inverter}_grid_recovery_soc).state'

                            # Clear ownership even if the user changed the
                            # output priority manually before recovery.
                            - lambda: |-
                                id(${name}_${inverter}_grid_fallback_active) = false;

              else:
                - logger.log:
                    level: ERROR
                    tag: "grid_fallback"
                    format: "Invalid grid thresholds: recovery SoC must be greater than fallback SoC"

          # Any fresh filtered SoC value also re-evaluates charging mode.
          - script.execute: ${name}_${inverter}_evaluate_charging_mode

    time_to_go:
      id: "${name}_${smartshunt}_time_to_go"
      name: "Time to go"
