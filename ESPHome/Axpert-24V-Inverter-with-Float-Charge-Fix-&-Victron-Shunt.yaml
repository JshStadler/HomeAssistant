number:

  ######## Thresholds Axpert ########

  - platform: template
    name: Bulk charge voltage
    id: ${name}_${inverter}_battery_bulk_voltage_number
    optimistic: true
    unit_of_measurement: 'V'
    icon: mdi:sine-wave
    min_value: 27.0
    max_value: 29.0
    step:  0.1
    initial_value: 28.2
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - output.pipsolar.set_level:
            id: ${name}_${inverter}_battery_bulk_voltage_set
            value: !lambda return (float(id(${name}_${inverter}_battery_bulk_voltage_number).state));

  - platform: template
    name: Float charge voltage
    id: ${name}_${inverter}_battery_float_voltage_number
    optimistic: true
    unit_of_measurement: 'V'
    icon: mdi:sine-wave
    min_value: 26.5
    max_value: 28.2
    step:  0.1
    initial_value: 26.8
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - output.pipsolar.set_level:
            id: ${name}_${inverter}_battery_float_voltage_set
            value: !lambda return (float(id(${name}_${inverter}_battery_float_voltage_number).state));                  
            
  - platform: template
    name: Cutoff voltage
    id: ${name}_${inverter}_battery_under_voltage_number
    optimistic: true
    unit_of_measurement: 'V'
    icon: mdi:sine-wave
    min_value: 21.0
    max_value: 24.0
    step:  0.1
    initial_value: 24.0
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - output.pipsolar.set_level:
            id: ${name}_${inverter}_battery_under_voltage_set
            value: !lambda return (id(${name}_${inverter}_battery_under_voltage_number).state);

 #  - platform: template
 #    name: ${name}_${inverter}_battery_recharge_voltage_number
 #    id: ${name}_${inverter}_battery_recharge_voltage_number
 #    optimistic: true
 #    unit_of_measurement: 'V'
 #    icon: mdi:sine-wave
 #    min_value: 44.0
 #    max_value: 51.0
 #    step:  1.0
 #    initial_value: 48.0
 #    restore_value: true
 #    mode: 'slider'
 #    on_value:
 #      then:
 #        - output.pipsolar.set_level:
 #            id: ${name}_${inverter}_battery_recharge_voltage_set
 #            value: !lambda return (id(${name}_${inverter}_battery_recharge_voltage_number).state);              
 
    ######### LiFePO4 Charging Parameters ########

  - platform: template
    name: Set float stage voltage
    id: ${name}_${inverter}_set_float_stage_voltage
    optimistic: true
    unit_of_measurement: 'V'
    icon: mdi:power-plug-battery-outline
    min_value: 26.5
    max_value: 27.5
    step: 0.1
    initial_value: 26.9
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - script.execute: ${name}_${inverter}_evaluate_charging_mode

  # Existing entity ID retained. Used as the BULK threshold when SmartShunt SoC is unavailable.
  - platform: template
    name: "Switch to bulk current"
    id: ${name}_${inverter}_switch_to_bulk_charge_current
    optimistic: true
    unit_of_measurement: 'A'
    icon: mdi:power-plug-battery-outline
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 4
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - script.execute: ${name}_${inverter}_evaluate_charging_mode

  # Existing entity ID retained. At/above Float target SoC, current at or below this enters FLOAT.
  - platform: template
    name: "Switch to float current"
    id: ${name}_${inverter}_switch_to_float_charge_current
    optimistic: true
    unit_of_measurement: 'A'
    icon: mdi:power-plug-battery-outline
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 3
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - script.execute: ${name}_${inverter}_evaluate_charging_mode

  # Once SoC reaches this level, FLOAT is allowed when tail current is low.
  - platform: template
    name: "Float target SoC"
    id: ${name}_${inverter}_target_soc
    optimistic: true
    unit_of_measurement: '%'
    icon: mdi:battery-charging-high
    min_value: 70
    max_value: 100
    step: 1
    initial_value: 95
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - script.execute: ${name}_${inverter}_evaluate_charging_mode

  # After FLOAT, do not request BULK again until SoC falls below this value.
  # This SoC hysteresis prevents a temporary rise in charge current from
  # repeatedly pushing a nearly-full LiFePO4 battery back to bulk voltage.
  - platform: template
    name: "Bulk restart SoC"
    id: ${name}_${inverter}_bulk_restart_soc
    optimistic: true
    unit_of_measurement: '%'
    icon: mdi:battery-arrow-down-outline
    min_value: 70
    max_value: 99
    step: 1
    initial_value: 93
    restore_value: true
    mode: 'slider'
    on_value:
      then:
        - script.execute: ${name}_${inverter}_evaluate_charging_mode

    ######### Low SoC Grid Parameters ########

  - platform: template
    name: "Grid fallback SoC"
    id: ${name}_${inverter}_grid_fallback_soc
    optimistic: true
    unit_of_measurement: '%'
    icon: mdi:battery-alert-variant-outline
    min_value: 10
    max_value: 50
    step: 1
    initial_value: 20
    restore_value: true
    mode: 'slider'

  # If low-SoC automation selected SUB, return to SBU only after reaching
  # this higher SoC.  The gap prevents rapid source-priority toggling.
  - platform: template
    name: "Grid recovery SoC"
    id: ${name}_${inverter}_grid_recovery_soc
    optimistic: true
    unit_of_measurement: '%'
    icon: mdi:battery-check-outline
    min_value: 15
    max_value: 80
    step: 1
    initial_value: 30
    restore_value: true
    mode: 'slider'

script:

  # ============================================================
  # LiFePO4 CHARGING STATE MACHINE
  #
  # With valid SmartShunt SoC:
  #   SoC < Bulk restart SoC                  -> BULK
  #   SoC >= Float target AND current <= tail -> FLOAT
  #   otherwise                               -> HOLD existing mode
  #
  # This gives SoC hysteresis (default 93%/95%).  Once FLOAT is
  # reached, a temporary increase in charging current does NOT force
  # the battery back to BULK while SoC remains above 93%.
  #
  # If SmartShunt SoC is unavailable/stale for 60s, fall back to current hysteresis:
  #   current >= bulk threshold -> BULK
  #   current <= float threshold -> FLOAT
  #   between thresholds -> HOLD
  # ============================================================
  - id: ${name}_${inverter}_evaluate_charging_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const float bulk_v =
                id(${name}_${inverter}_battery_bulk_voltage_number).state;
              const float float_v =
                id(${name}_${inverter}_set_float_stage_voltage).state;
              const float restart_soc =
                id(${name}_${inverter}_bulk_restart_soc).state;
              const float target_soc =
                id(${name}_${inverter}_target_soc).state;
              const float float_current =
                id(${name}_${inverter}_switch_to_float_charge_current).state;
              const float bulk_current =
                id(${name}_${inverter}_switch_to_bulk_charge_current).state;

              return !isnan(bulk_v)
                  && !isnan(float_v)
                  && !isnan(restart_soc)
                  && !isnan(target_soc)
                  && !isnan(float_current)
                  && !isnan(bulk_current)
                  && (float_v < bulk_v)
                  && (restart_soc < target_soc)
                  && (float_current < bulk_current);

          then:
            # ----------------------------------------------------
            # SmartShunt SoC is available: filtered SoC is authoritative.
            # SoC changes slowly, and filtering rejects isolated bad readings
            # that could otherwise cause false charge-state transitions.
            # ----------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    const uint32_t last_valid =
                      id(${name}_${smartshunt}_soc_last_valid_ms);

                    const bool fresh =
                      id(${name}_${smartshunt}_soc_raw_seen)
                      && (last_valid != 0)
                      && ((uint32_t) (millis() - last_valid) < 60000UL);

                    return fresh
                        && !isnan(id(${name}_${smartshunt}_state_of_charge).state);

                then:
                  # SoC below restart threshold -> BULK.
                  - if:
                      condition:
                        lambda: |-
                          return id(${name}_${smartshunt}_state_of_charge).state
                              < id(${name}_${inverter}_bulk_restart_soc).state;

                      then:
                        - if:
                            condition:
                              lambda: |-
                                const float actual_float_v =
                                  id(${name}_${inverter}_battery_float_voltage).state;
                                const float desired_bulk_v =
                                  id(${name}_${inverter}_battery_bulk_voltage_number).state;

                                return !isnan(desired_bulk_v)
                                    && (
                                         isnan(actual_float_v)
                                         || fabsf(actual_float_v - desired_bulk_v) > 0.05f
                                       );

                            then:
                              - output.pipsolar.set_level:
                                  id: ${name}_${inverter}_battery_float_voltage_set
                                  value: !lambda |-
                                    const float soc =
                                      id(${name}_${smartshunt}_state_of_charge).state;
                                    const float restart_soc =
                                      id(${name}_${inverter}_bulk_restart_soc).state;
                                    const float bulk_v =
                                      id(${name}_${inverter}_battery_bulk_voltage_number).state;

                                    ESP_LOGI(
                                      "charging_logic",
                                      "SoC %.1f%% < %.1f%% restart -> BULK %.1fV",
                                      soc,
                                      restart_soc,
                                      bulk_v
                                    );
                                    return bulk_v;

                      # SoC is at/above restart threshold.
                      else:
                        # Enter FLOAT only when BOTH target SoC and low tail
                        # current are satisfied.  Otherwise keep the mode.
                        - if:
                            condition:
                              lambda: |-
                                const float soc =
                                  id(${name}_${smartshunt}_state_of_charge).state;
                                const float current =
                                  id(${name}_${inverter}_battery_charging_current).state;
                                const float target_soc =
                                  id(${name}_${inverter}_target_soc).state;
                                const float float_current =
                                  id(${name}_${inverter}_switch_to_float_charge_current).state;

                                return !isnan(current)
                                    && (soc >= target_soc)
                                    && (current <= float_current);

                            then:
                              - if:
                                  condition:
                                    lambda: |-
                                      const float actual_float_v =
                                        id(${name}_${inverter}_battery_float_voltage).state;
                                      const float desired_float_v =
                                        id(${name}_${inverter}_set_float_stage_voltage).state;

                                      return !isnan(desired_float_v)
                                          && (
                                               isnan(actual_float_v)
                                               || fabsf(actual_float_v - desired_float_v) > 0.05f
                                             );

                                  then:
                                    - output.pipsolar.set_level:
                                        id: ${name}_${inverter}_battery_float_voltage_set
                                        value: !lambda |-
                                          const float soc =
                                            id(${name}_${smartshunt}_state_of_charge).state;
                                          const float current =
                                            id(${name}_${inverter}_battery_charging_current).state;
                                          const float target_soc =
                                            id(${name}_${inverter}_target_soc).state;
                                          const float float_current =
                                            id(${name}_${inverter}_switch_to_float_charge_current).state;
                                          const float float_v =
                                            id(${name}_${inverter}_set_float_stage_voltage).state;

                                          ESP_LOGI(
                                            "charging_logic",
                                            "SoC %.1f%% >= %.1f%% and %.1fA <= %.1fA -> FLOAT %.1fV",
                                            soc,
                                            target_soc,
                                            current,
                                            float_current,
                                            float_v
                                          );
                                          return float_v;

                # ----------------------------------------------------
                # No SmartShunt SoC: current-based fallback only.
                # ----------------------------------------------------
                else:
                  - if:
                      condition:
                        lambda: |-
                          const float current =
                            id(${name}_${inverter}_battery_charging_current).state;
                          const float bulk_current =
                            id(${name}_${inverter}_switch_to_bulk_charge_current).state;

                          return !isnan(current)
                              && (current >= bulk_current);

                      then:
                        - if:
                            condition:
                              lambda: |-
                                const float actual_float_v =
                                  id(${name}_${inverter}_battery_float_voltage).state;
                                const float desired_bulk_v =
                                  id(${name}_${inverter}_battery_bulk_voltage_number).state;

                                return !isnan(desired_bulk_v)
                                    && (
                                         isnan(actual_float_v)
                                         || fabsf(actual_float_v - desired_bulk_v) > 0.05f
                                       );

                            then:
                              - output.pipsolar.set_level:
                                  id: ${name}_${inverter}_battery_float_voltage_set
                                  value: !lambda |-
                                    const float current =
                                      id(${name}_${inverter}_battery_charging_current).state;
                                    const float bulk_current =
                                      id(${name}_${inverter}_switch_to_bulk_charge_current).state;
                                    const float bulk_v =
                                      id(${name}_${inverter}_battery_bulk_voltage_number).state;

                                    ESP_LOGW(
                                      "charging_logic",
                                      "No SoC: %.1fA >= %.1fA -> BULK %.1fV",
                                      current,
                                      bulk_current,
                                      bulk_v
                                    );
                                    return bulk_v;

                      else:
                        - if:
                            condition:
                              lambda: |-
                                const float current =
                                  id(${name}_${inverter}_battery_charging_current).state;
                                const float float_current =
                                  id(${name}_${inverter}_switch_to_float_charge_current).state;

                                return !isnan(current)
                                    && (current <= float_current);

                            then:
                              - if:
                                  condition:
                                    lambda: |-
                                      const float actual_float_v =
                                        id(${name}_${inverter}_battery_float_voltage).state;
                                      const float desired_float_v =
                                        id(${name}_${inverter}_set_float_stage_voltage).state;

                                      return !isnan(desired_float_v)
                                          && (
                                               isnan(actual_float_v)
                                               || fabsf(actual_float_v - desired_float_v) > 0.05f
                                             );

                                  then:
                                    - output.pipsolar.set_level:
                                        id: ${name}_${inverter}_battery_float_voltage_set
                                        value: !lambda |-
                                          const float current =
                                            id(${name}_${inverter}_battery_charging_current).state;
                                          const float float_current =
                                            id(${name}_${inverter}_switch_to_float_charge_current).state;
                                          const float float_v =
                                            id(${name}_${inverter}_set_float_stage_voltage).state;

                                          ESP_LOGW(
                                            "charging_logic",
                                            "No SoC: %.1fA <= %.1fA -> FLOAT %.1fV",
                                            current,
                                            float_current,
                                            float_v
                                          );
                                          return float_v;

          else:
            - lambda: |-
                ESP_LOGE(
                  "charging_logic",
                  "Invalid charging settings: require FLOAT V < BULK V, restart SoC < target SoC, and float current < bulk current"
                );

