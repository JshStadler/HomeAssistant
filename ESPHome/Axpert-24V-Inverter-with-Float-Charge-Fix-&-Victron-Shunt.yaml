substitutions:
  name: inverter
 #  ats: inverseur
  smartshunt: victron
  inverter: axpert

  tx_pin_victron: GPIO25 # Not connected! The communication is read-only
  rx_pin_victron: GPIO26 # Connect this GPIO and GND to the VE.direct port
  rx_buffer_size_victron: '256'
  baud_rate_victron: '19200'
  battery_ah_capacity: '200.00'

  tx_pin_inverter: GPIO17
  rx_pin_inverter: GPIO16
  baud_rate_inverter: '2400'

  template_update: 2s
  slow_template_update: 60s
  text_update: 5s

esphome:
  name: ${name}
  friendly_name: Inverter & Shunt
  comment: Axpert 24V Inverter with LiFePO4 SoC Hysteresis, Filtered SmartShunt SoC
  #  name_add_mac_suffix: true
  # Preserve the original current-threshold entity IDs. If an older build
  # restores the previous 3A BULK / 4A FLOAT values, automatically normalize
  # them to a valid 4A BULK / 3A FLOAT hysteresis pair. User-set valid values
  # are left untouched.
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: |-
                const float bulk_current =
                  id(${name}_${inverter}_switch_to_bulk_charge_current).state;
                const float float_current =
                  id(${name}_${inverter}_switch_to_float_charge_current).state;

                return !isnan(bulk_current)
                    && !isnan(float_current)
                    && (bulk_current <= float_current);
            then:
              - logger.log:
                  level: WARN
                  tag: "charging_logic"
                  format: "Normalizing restored current thresholds to BULK 4A / FLOAT 3A"
              - number.set:
                  id: ${name}_${inverter}_switch_to_float_charge_current
                  value: 3
              - number.set:
                  id: ${name}_${inverter}_switch_to_bulk_charge_current
                  value: 4

  #platformio_options:
    # build_flags: 
      # - -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768 #16384 #8192 #16384 # #  
    # platform_packages:
      # - framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.2
    # platform:
      # - https://github.com/platformio/platform-espressif32.git#feature/arduino-upstream

preferences:
  flash_write_interval: 10min
      
esp32:
  framework:
    type: esp-idf
  variant: ESP32
  cpu_frequency: 80MHz
external_components:
  - source: github://syssi/esphome-pipsolar@main
    refresh: 0s  
  - source: github://KinDR007/VictronMPPT-ESPHOME@main
    refresh: 0s
    
# Enable logging
logger:
  level: INFO
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ethernet:
#   type: DP83848
#   mdc_pin: GPIO18
#   mdio_pin: GPIO19
#   clk_mode: GPIO17_OUT
#   power_pin: GPIO21
#   phy_addr: 0
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  Optional manual IP
  manual_ip:
    static_ip: 10.0.0.31
    gateway: 10.0.0.254
    subnet: 255.255.255.0
    dns1: 10.0.0.254

 #    reboot_timeout: 1h

  ap:
    ssid: "Inverter Fallback Hotspot"
    password: !secret ap_password

  min_auth_mode: WPA2
web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest
  # - id: ${name}_${smartshunt}_battery_discharging_power_yesterday_global
  #   type: float
  #   restore_value: yes

globals:
  # True only when this ESPHome automation changed output priority to
  # Solar Utility Battery because of low SoC.  This lets recovery logic
  # restore SBU without undoing a mode that was already selected manually.
  - id: ${name}_${inverter}_grid_fallback_active
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Raw SoC is used ONLY as a communications heartbeat. Threshold decisions
  # always use the median-filtered SoC state.
  - id: ${name}_${smartshunt}_soc_raw_seen
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${name}_${smartshunt}_soc_last_valid_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

